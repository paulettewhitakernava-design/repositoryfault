<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --bg-1: #1c1433;
  --bg-2: #0f0d1a;
  --ink: #f5f2ff;
  --muted: #928cae;
  --accent: #ff8a5c;
  --accent-2: #7cf5c4;
  --danger: #ff8a8a;
  --line: rgba(255,255,255,0.10);
  --card: rgba(255,255,255,0.055);
  --card-solid: #211a3a;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 100% at 15% 0%, var(--bg-1) 0%, var(--bg-2) 55%);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  padding: calc(28px + var(--safe-t)) 20px calc(100px + var(--safe-b));
  max-width: 480px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
}

button, input, .item, .del { touch-action: manipulation; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(24px) scale(0.97); } }
@keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 25px; margin: 0; letter-spacing: -0.01em; }
.badge {
  width: 40px; height: 40px; border-radius: 14px;
  background: linear-gradient(135deg, var(--accent), #ff5c9e);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; box-shadow: 0 8px 20px -8px rgba(255,138,92,0.6);
  flex-shrink: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 24px 22px;
  margin-bottom: 26px;
  animation: rise 0.5s ease both;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card-num {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px;
  letter-spacing: -0.03em; line-height: 1;
  background: linear-gradient(90deg, var(--ink), var(--accent-2) 130%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.card-split { display: flex; gap: 20px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.card-split div { flex: 1; min-width: 0; }
.card-split div span:first-child {
  display: block; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-split div span:last-child { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.up { color: var(--accent-2); }
.down { color: var(--danger); }

form { display: grid; gap: 14px; margin-bottom: 36px; }

/* ---- Segmented tab control (fixed + modernized) ---- */
.type-toggle {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 999px;
  margin-bottom: 6px;
}
.tab-indicator {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: calc((100% - 8px) / 3);
  border-radius: 999px;
  background: var(--danger);
  transition: transform 0.28s cubic-bezier(.65,0,.35,1), background-color 0.28s ease;
  z-index: 0;
}
.type-toggle button {
  position: relative;
  z-index: 1;
  min-height: 44px;
  padding: 10px 0;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  font-family: 'Manrope', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color 0.2s ease, transform 0.15s ease;
}
.type-toggle button:active { transform: scale(0.96); }
.type-toggle button[aria-selected="true"][data-type="gasto"] { color: #2a0d0d; }
.type-toggle button[aria-selected="true"][data-type="ingreso"] { color: #06231a; }
.type-toggle button[aria-selected="true"][data-type="ahorro"] { color: #2a1608; }

.field-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
input {
  width: 100%;
  padding: 12px 2px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  font-family: 'Manrope', sans-serif;
  transition: border-color 0.2s;
  min-height: 22px;
}
input:focus { outline: none; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.btn-add {
  font-family: 'Manrope', sans-serif;
  background: linear-gradient(135deg, var(--accent), #ff5c9e);
  color: #1c0f08;
  border: none;
  padding: 16px;
  min-height: 50px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px -8px rgba(255,138,92,0.5);
  transition: transform 0.15s;
}
.btn-add:active { transform: scale(0.97); }
.btn-add:disabled { opacity: 0.5; }

.section-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.section-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.section-count { font-size: 11px; color: var(--muted); }

.item {
  padding: 16px 4px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  animation: rise 0.4s ease both;
}
.item.removing { animation: fadeOut 0.25s ease forwards; }
.item .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.item .icon {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.item .icon.gasto { background: rgba(255,138,138,0.14); color: var(--danger); }
.item .icon.ingreso { background: rgba(124,245,196,0.14); color: var(--accent-2); }
.item .icon.ahorro { background: rgba(255,138,92,0.14); color: var(--accent); }
.item .text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .monto { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.item .monto.gasto { color: var(--danger); }
.item .monto.ingreso { color: var(--accent-2); }
.item .monto.ahorro { color: var(--accent); }
.item .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .del {
  background: none; border: none; color: var(--muted); font-size: 12px;
  padding: 10px; min-height: 40px; min-width: 40px; cursor: pointer; flex-shrink: 0;
}
.item .del:active { color: var(--accent); }

.empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 13px; }
.skeleton {
  height: 52px; border-radius: 14px; margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 37%, rgba(255,255,255,0.04) 63%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease infinite;
}

.toast {
  position: fixed;
  bottom: calc(26px + var(--safe-b));
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--accent-2);
  color: #06231a;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
  z-index: 10;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); animation: pop 0.25s ease; }
.toast.error { background: var(--danger); color: #2a0d0d; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="eyebrow">Control diario</div>
    <h1>Registro de gastos</h1>
  </div>
  <div class="badge">💸</div>
</div>

<div class="card">
  <div class="card-lbl">Total ahorrado</div>
  <div class="card-num" id="sum-ahorro">$0</div>
  <div class="card-split">
    <div><span class="up" id="sum-ingreso">$0</span><span>Ingresos</span></div>
    <div><span class="down" id="sum-gasto">$0</span><span>Gastos</span></div>
    <div><span id="sum-disponible">$0</span><span>Disponible</span></div>
  </div>
</div>

<form id="form-gasto">
  <div class="type-toggle" role="tablist" aria-label="Tipo de movimiento">
    <div class="tab-indicator" id="tab-indicator"></div>
    <button type="button" role="tab" data-type="gasto" aria-selected="true">↓ Gasto</button>
    <button type="button" role="tab" data-type="ingreso" aria-selected="false">↑ Ingreso</button>
    <button type="button" role="tab" data-type="ahorro" aria-selected="false">● Ahorro</button>
  </div>

  <div class="row2">
    <div>
      <label class="field-label" for="monto">Monto</label>
      <input type="number" id="monto" step="0.01" inputmode="decimal" placeholder="0.00" required>
    </div>
    <div>
      <label class="field-label" for="fecha">Fecha</label>
      <input type="date" id="fecha" required>
    </div>
  </div>
  <div>
    <label class="field-label" for="nota">Nota</label>
    <input type="text" id="nota" placeholder="ej. transporte, quincena, etc.">
  </div>
  <button type="submit" class="btn-add" id="btn-add">Agregar</button>
</form>

<div class="section-row">
  <div class="section-label">Movimientos</div>
  <div class="section-count" id="section-count"></div>
</div>
<div id="lista">
  <div class="skeleton"></div>
  <div class="skeleton" style="opacity:.7"></div>
  <div class="skeleton" style="opacity:.45"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let gastos = [];
let tipoActual = 'gasto';

const tipos = ['gasto', 'ingreso', 'ahorro'];
const coloresTab = { gasto: 'var(--danger)', ingreso: 'var(--accent-2)', ahorro: 'var(--accent)' };
const etiquetas = { gasto: 'Gasto', ingreso: 'Ingreso', ahorro: 'Ahorro' };
const signos = { gasto: '−', ingreso: '+', ahorro: '→' };
const iconos = { gasto: '↓', ingreso: '↑', ahorro: '●' };

document.getElementById('fecha').valueAsDate = new Date();

// --- Tabs: single delegated listener + explicit state, robust on mobile webviews ---
const toggle = document.querySelector('.type-toggle');
const indicator = document.getElementById('tab-indicator');

function setTipo(tipo) {
  tipoActual = tipo;
  const btn = toggle.querySelector('button[data-type="' + tipo + '"]');
  indicator.style.width = btn.offsetWidth + 'px';
  indicator.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  indicator.style.background = coloresTab[tipo];
  toggle.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.type === tipo ? 'true' : 'false');
  });
}

toggle.addEventListener('click', function(e) {
  const btn = e.target.closest('button[data-type]');
  if (!btn) return;
  setTipo(btn.dataset.type);
});

setTipo('gasto');
window.addEventListener('resize', () => setTipo(tipoActual));

function cargarDatos() {
  google.script.run.withSuccessHandler(function(data) {
    gastos = data;
    render();
  }).withFailureHandler(function() {
    document.getElementById('lista').innerHTML = '<div class="empty">No se pudo cargar. Desliza para reintentar.</div>';
  }).obtenerMovimientos();
}

document.getElementById('form-gasto').addEventListener('submit', function(e) {
  e.preventDefault();
  const monto = parseFloat(document.getElementById('monto').value);
  const fecha = document.getElementById('fecha').value;
  const nota = document.getElementById('nota').value;
  if (!monto || monto <= 0) return;

  const mov = { id: Date.now(), monto, fecha, nota, tipo: tipoActual };
  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  google.script.run.withSuccessHandler(function() {
    gastos.unshift(mov);
    render();
    showToast('Movimiento agregado');
    document.getElementById('form-gasto').reset();
    document.getElementById('fecha').valueAsDate = new Date();
    setTipo('gasto');
    btn.disabled = false;
    btn.textContent = 'Agregar';
  }).withFailureHandler(function() {
    showToast('Error al guardar', true);
    btn.disabled = false;
    btn.textContent = 'Agregar';
  }).guardarMovimiento(mov);
});

function eliminarGasto(id) {
  const el = document.getElementById('item-' + id);
  if (el) el.classList.add('removing');
  google.script.run.withSuccessHandler(function() {
    setTimeout(() => {
      gastos = gastos.filter(g => g.id !== id);
      render();
    }, 220);
  }).withFailureHandler(function() {
    if (el) el.classList.remove('removing');
    showToast('No se pudo borrar', true);
  }).eliminarMovimiento(id);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function fmt(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function render() {
  const lista = document.getElementById('lista');
  document.getElementById('section-count').textContent = gastos.length
    ? gastos.length + (gastos.length === 1 ? ' movimiento' : ' movimientos')
    : '';

  if (gastos.length === 0) {
    lista.innerHTML = '<div class="empty">Sin movimientos todavía</div>';
  } else {
    lista.innerHTML = gastos.map((g, i) => `
      <div class="item" id="item-${g.id}" style="animation-delay:${Math.min(i,8) * 0.03}s">
        <div class="left">
          <div class="icon ${g.tipo}">${iconos[g.tipo]}</div>
          <div class="text">
            <span class="monto ${g.tipo}">${signos[g.tipo]} ${fmt(g.monto)}</span>
            <span class="meta">${etiquetas[g.tipo]}${g.nota ? ' — ' + g.nota : ''} · ${g.fecha}</span>
          </div>
        </div>
        <button class="del" onclick="eliminarGasto(${g.id})" aria-label="Borrar movimiento">Borrar</button>
      </div>
    `).join('');
  }

  const totalIngreso = gastos.filter(g => g.tipo === 'ingreso').reduce((s, g) => s + Number(g.monto), 0);
  const totalGasto = gastos.filter(g => g.tipo === 'gasto').reduce((s, g) => s + Number(g.monto), 0);
  const totalAhorro = gastos.filter(g => g.tipo === 'ahorro').reduce((s, g) => s + Number(g.monto), 0);
  const disponible = totalIngreso - totalGasto - totalAhorro;

  document.getElementById('sum-ingreso').textContent = fmt(totalIngreso);
  document.getElementById('sum-gasto').textContent = fmt(totalGasto);
  document.getElementById('sum-ahorro').textContent = fmt(totalAhorro);
  document.getElementById('sum-disponible').textContent = fmt(disponible);
}

cargarDatos();
</script>
</body>
</html>
