<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;600;700&display=swap');

:root {
  --bg-1: #1c1433;
  --bg-2: #0f0d1a;
  --ink: #f5f2ff;
  --muted: #928cae;
  --accent: #ff8a5c;
  --accent-2: #7cf5c4;
  --danger: #ff8a8a;
  --line: rgba(255,255,255,0.10);
  --card: rgba(255,255,255,0.055);
  --card-solid: #211a3a;
  --overlay: rgba(8,6,16,0.72);
  --nav-h: 78px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg-2);
  height: 100%;
  overflow: hidden;
}

body {
  margin: 0;
  height: 100%;
  height: 100dvh;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: radial-gradient(120% 100% at 15% 0%, var(--bg-1) 0%, var(--bg-2) 55%);
  color: var(--ink);
  font-family: 'Manrope', sans-serif;
  -webkit-font-smoothing: antialiased;
}

#scroll {
  height: 100%;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding: calc(20px + var(--safe-t)) 20px calc(var(--nav-h) + var(--safe-b) + 20px);
  max-width: 480px;
  margin: 0 auto;
}

button, input, .item, .nav-btn { touch-action: manipulation; }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(24px) scale(0.97); } }
@keyframes pop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blurIn { from { opacity: 0; filter: blur(9px); transform: translateY(6px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ---- Header ---- */
.header { margin-bottom: 22px; }
.eyebrow { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; animation: blurIn 0.9s ease both; }
h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 26px; margin: 0; letter-spacing: -0.01em; animation: blurIn 0.9s ease 0.08s both; }

/* ---- Screens ---- */
.screen { display: none; }
.screen.active { display: block; animation: screenIn 0.28s ease both; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 24px 22px;
  margin-bottom: 20px;
  animation: rise 0.5s ease both;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.card-lbl { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card-num {
  font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 44px;
  letter-spacing: -0.03em; line-height: 1;
  background: linear-gradient(90deg, var(--ink), var(--accent-2) 130%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.card-split { display: flex; gap: 20px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
.card-split div { flex: 1; min-width: 0; }
.card-split div span:first-child {
  display: block; font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-split div span:last-child { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
.up { color: var(--accent-2); }
.down { color: var(--danger); }

/* ---- Mini preview (Inicio) ---- */
.preview-card { cursor: pointer; }
.preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.preview-head .link { font-size: 11px; color: var(--accent); font-weight: 700; }
.preview-bars { display: flex; align-items: flex-end; gap: 16px; height: 54px; }
.preview-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.preview-bar { width: 100%; max-width: 46px; border-radius: 6px 6px 2px 2px; min-height: 4px; }
.preview-bar.ingreso { background: var(--accent-2); }
.preview-bar.gasto { background: var(--danger); }
.preview-bar-lbl { font-size: 10px; color: var(--muted); }
.preview-bar-val { font-size: 11px; font-weight: 700; color: var(--ink); }

/* ---- Chart (Analisis) ---- */
.chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.legend { display: flex; gap: 14px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.chart-wrap { margin-top: 14px; }
.chart-tip { font-size: 12px; color: var(--muted); margin-top: 10px; min-height: 16px; }
.chart-tip b { color: var(--ink); font-weight: 600; }
.chart-empty { padding: 28px 0 6px; text-align: center; color: var(--muted); font-size: 13px; }
.bar-group { cursor: pointer; }

.period-toggle {
  position: relative;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px;
  padding: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 999px;
  margin-bottom: 18px;
}
.period-indicator {
  position: absolute; top: 4px; bottom: 4px; left: 0;
  border-radius: 999px; background: var(--accent);
  transition: transform 0.28s cubic-bezier(.65,0,.35,1);
}
.period-toggle button {
  position: relative; z-index: 1; min-height: 42px; border-radius: 999px; border: none;
  background: transparent; color: var(--muted); font-size: 13px; font-weight: 700;
  font-family: 'Manrope', sans-serif; cursor: pointer; transition: color 0.2s;
}
.period-toggle button[aria-selected="true"] { color: #2a1608; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; }
.stat-tile .stat-lbl { font-size: 9.5px; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; line-height: 1.3; }
.stat-tile .stat-val { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; }
.insight {
  background: rgba(255,138,92,0.08); border: 1px solid rgba(255,138,92,0.2);
  border-radius: 16px; padding: 14px 16px; font-size: 12.5px; color: var(--ink); line-height: 1.5;
}
.insight b { color: var(--accent); }

form { display: grid; gap: 14px; margin-bottom: 8px; }

/* ---- Segmented tab control ---- */
.type-toggle {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--line);
  border-radius: 999px;
  margin-bottom: 6px;
}
.tab-indicator {
  position: absolute;
  top: 4px; bottom: 4px; left: 0;
  width: calc((100% - 8px) / 3);
  border-radius: 999px;
  background: var(--danger);
  transition: transform 0.28s cubic-bezier(.65,0,.35,1), background-color 0.28s ease;
  z-index: 0;
}
.type-toggle button {
  position: relative;
  z-index: 1;
  min-height: 44px;
  padding: 10px 0;
  border-radius: 999px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  font-family: 'Manrope', sans-serif;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: color 0.2s ease, transform 0.15s ease;
}
.type-toggle button:active { transform: scale(0.96); }
.type-toggle button[aria-selected="true"][data-type="gasto"] { color: #2a0d0d; }
.type-toggle button[aria-selected="true"][data-type="ingreso"] { color: #06231a; }
.type-toggle button[aria-selected="true"][data-type="ahorro"] { color: #2a1608; }

.field-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
input {
  width: 100%;
  padding: 12px 2px;
  border: none;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  font-family: 'Manrope', sans-serif;
  transition: border-color 0.2s;
  min-height: 22px;
}
input:focus { outline: none; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.btn-add {
  font-family: 'Manrope', sans-serif;
  background: linear-gradient(135deg, var(--accent), #ff5c9e);
  color: #1c0f08;
  border: none;
  padding: 16px;
  min-height: 50px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 24px -8px rgba(255,138,92,0.5);
  transition: transform 0.15s;
}
.btn-add:active { transform: scale(0.97); }
.btn-add:disabled { opacity: 0.5; }

.btn-ghost {
  font-family: 'Manrope', sans-serif;
  background: rgba(255,255,255,0.05);
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 13px;
  min-height: 44px;
  width: 100%;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  margin-top: 6px;
}
.btn-ghost:active { transform: scale(0.98); background: rgba(255,255,255,0.09); }

.btn-danger {
  font-family: 'Manrope', sans-serif;
  background: transparent;
  color: var(--danger);
  border: 1px solid rgba(255,138,138,0.35);
  padding: 15px;
  min-height: 50px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
}
.btn-danger:active { transform: scale(0.97); background: rgba(255,138,138,0.1); }

.section-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.section-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.section-count { font-size: 11px; color: var(--muted); }

.item {
  padding: 16px 4px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  animation: rise 0.4s ease both;
  cursor: pointer;
  border-radius: 12px;
  transition: background 0.15s;
}
.item:active { background: rgba(255,255,255,0.04); }
.item.removing { animation: fadeOut 0.25s ease forwards; }
.item .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.item .icon {
  width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.item .icon.gasto { background: rgba(255,138,138,0.14); color: var(--danger); }
.item .icon.ingreso { background: rgba(124,245,196,0.14); color: var(--accent-2); }
.item .icon.ahorro { background: rgba(255,138,92,0.14); color: var(--accent); }
.item .text { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item .monto { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; }
.item .monto.gasto { color: var(--danger); }
.item .monto.ingreso { color: var(--accent-2); }
.item .monto.ahorro { color: var(--accent); }
.item .meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .chev { color: var(--muted); font-size: 14px; flex-shrink: 0; padding: 8px; }

.empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 13px; }
.empty .retry {
  display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 999px;
  background: rgba(255,255,255,0.06); color: var(--ink); font-size: 12px; font-weight: 700;
  border: 1px solid var(--line); cursor: pointer;
}
.skeleton {
  height: 52px; border-radius: 14px; margin-bottom: 10px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 37%, rgba(255,255,255,0.04) 63%);
  background-size: 400px 100%;
  animation: shimmer 1.4s ease infinite;
}

.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--accent-2);
  color: #06231a;
  padding: 12px 22px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
  z-index: 30;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); animation: pop 0.25s ease; }
.toast.error { background: var(--danger); color: #2a0d0d; }

/* ---- Edit bottom sheet ---- */
.overlay {
  position: fixed; inset: 0; background: var(--overlay);
  z-index: 40; display: none; align-items: flex-end; justify-content: center;
  animation: overlayIn 0.2s ease;
}
.overlay.show { display: flex; }
.sheet {
  width: 100%; max-width: 480px;
  background: var(--card-solid);
  border: 1px solid var(--line);
  border-bottom: none;
  border-radius: 26px 26px 0 0;
  padding: 14px 22px calc(26px + var(--safe-b));
  animation: sheetUp 0.28s cubic-bezier(.32,.72,0,1);
}
.sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto 18px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sheet-head h2 { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 500; margin: 0; }
.sheet-close {
  background: rgba(255,255,255,0.06); border: none; color: var(--muted);
  width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer;
}
.sheet form { margin-bottom: 0; gap: 16px; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

/* ---- Bottom nav ---- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(20,15,36,0.82);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: flex-start;
  z-index: 25;
}
.nav-inner { max-width: 480px; margin: 0 auto; width: 100%; display: flex; padding-top: 10px; }
.nav-btn {
  flex: 1; background: none; border: none; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 600; cursor: pointer;
  transition: color 0.2s, transform 0.15s;
}
.nav-btn:active { transform: scale(0.94); }
.nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; transition: stroke 0.2s; }
.nav-btn.active { color: var(--ink); }
.nav-btn.active svg { stroke: var(--accent); }
</style>
</head>
<body>
<div id="scroll">

<!-- ===== INICIO ===== -->
<div class="screen active" id="screen-inicio">
  <div class="header">
    <div class="eyebrow" id="greeting">Control diario</div>
    <h1>Registro de gastos</h1>
  </div>

  <div class="card">
    <div class="card-lbl">Total ahorrado</div>
    <div class="card-num" id="sum-ahorro">$0</div>
    <div class="card-split">
      <div><span class="up" id="sum-ingreso">$0</span><span>Ingresos</span></div>
      <div><span class="down" id="sum-gasto">$0</span><span>Gastos</span></div>
      <div><span id="sum-disponible">$0</span><span>Disponible</span></div>
    </div>
  </div>

  <div class="card preview-card" id="preview-card">
    <div class="preview-head">
      <div class="card-lbl" style="margin-bottom:0">Este mes</div>
      <span class="link">Ver análisis ›</span>
    </div>
    <div class="preview-bars" id="preview-bars"></div>
  </div>

  <div class="section-row">
    <div class="section-label">Movimientos</div>
    <div class="section-count" id="section-count"></div>
  </div>
  <div id="lista">
    <div class="skeleton"></div>
    <div class="skeleton" style="opacity:.7"></div>
    <div class="skeleton" style="opacity:.45"></div>
  </div>
  <button type="button" class="btn-ghost" id="btn-ver-mas" style="display:none"></button>
</div>

<!-- ===== ANALISIS ===== -->
<div class="screen" id="screen-analisis">
  <div class="header">
    <div class="eyebrow">Analítica</div>
    <h1>Análisis</h1>
  </div>

  <div class="period-toggle" role="tablist" aria-label="Periodo" id="toggle-periodo">
    <div class="period-indicator" id="period-indicator"></div>
    <button type="button" role="tab" data-periodo="quincena" aria-selected="true">Quincenal</button>
    <button type="button" role="tab" data-periodo="mensual" aria-selected="false">Mensual</button>
  </div>

  <div class="card">
    <div class="chart-head">
      <div class="card-lbl" style="margin-bottom:0">Gastos vs ingresos</div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot" style="background:var(--accent-2)"></span>Ingreso</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--danger)"></span>Gasto</div>
      </div>
    </div>
    <div class="chart-wrap" id="chart-wrap"></div>
    <div class="chart-tip" id="chart-tip">Toca una barra para ver el detalle</div>
  </div>

  <div class="stat-row" id="stat-row"></div>
  <div class="insight" id="insight"></div>
</div>

<!-- ===== AGREGAR ===== -->
<div class="screen" id="screen-agregar">
  <div class="header">
    <div class="eyebrow">Nuevo</div>
    <h1>Agregar movimiento</h1>
  </div>

  <form id="form-gasto">
    <div class="type-toggle" role="tablist" aria-label="Tipo de movimiento" id="toggle-add">
      <div class="tab-indicator"></div>
      <button type="button" role="tab" data-type="gasto" aria-selected="true">↓ Gasto</button>
      <button type="button" role="tab" data-type="ingreso" aria-selected="false">↑ Ingreso</button>
      <button type="button" role="tab" data-type="ahorro" aria-selected="false">● Ahorro</button>
    </div>

    <div class="row2">
      <div>
        <label class="field-label" for="monto">Monto</label>
        <input type="number" id="monto" step="0.01" inputmode="decimal" placeholder="0.00" required>
      </div>
      <div>
        <label class="field-label" for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>
    </div>
    <div>
      <label class="field-label" for="nota">Nota</label>
      <input type="text" id="nota" placeholder="ej. transporte, quincena, etc.">
    </div>
    <button type="submit" class="btn-add" id="btn-add">Agregar</button>
  </form>
</div>

</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Editar movimiento</h2>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Cerrar">✕</button>
    </div>
    <form id="form-edit">
      <div class="type-toggle" role="tablist" aria-label="Tipo de movimiento" id="toggle-edit">
        <div class="tab-indicator"></div>
        <button type="button" role="tab" data-type="gasto" aria-selected="true">↓ Gasto</button>
        <button type="button" role="tab" data-type="ingreso" aria-selected="false">↑ Ingreso</button>
        <button type="button" role="tab" data-type="ahorro" aria-selected="false">● Ahorro</button>
      </div>
      <div class="row2">
        <div>
          <label class="field-label" for="edit-monto">Monto</label>
          <input type="number" id="edit-monto" step="0.01" inputmode="decimal" required>
        </div>
        <div>
          <label class="field-label" for="edit-fecha">Fecha</label>
          <input type="date" id="edit-fecha" required>
        </div>
      </div>
      <div>
        <label class="field-label" for="edit-nota">Nota</label>
        <input type="text" id="edit-nota" placeholder="ej. transporte, quincena, etc.">
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn-danger" id="btn-eliminar">Eliminar</button>
        <button type="submit" class="btn-add" id="btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M12 20V4"/><path d="M20 20v-7"/></svg>
      <span>Análisis</span>
    </button>
    <button class="nav-btn" data-screen="agregar">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
      <span>Agregar</span>
    </button>

<script>
// Pega aquí la URL /exec de tu Apps Script (Implementar → Nueva implementación → Aplicación web)
const API_URL = 'https://script.google.com/macros/s/AKfycbwgr_LvBHYWnXt76xdjjdYiPJkaVY0VLRUEO9hi4HShL3AB2HWshxteM6UqA0y0i-vg/exec';

function apiGet(action) {
  return fetch(API_URL + '?action=' + encodeURIComponent(action)).then(function(r) { return r.json(); });
}
function apiPost(payload) {
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json(); });
}

let gastos = [];
let editandoId = null;
let datosCargados = false;
let mostrarTodos = false;
let modoAnalisis = 'quincena';

const LIMITE_LISTA = 10;
const tipos = ['gasto', 'ingreso', 'ahorro'];
const coloresTab = { gasto: 'var(--danger)', ingreso: 'var(--accent-2)', ahorro: 'var(--accent)' };
const etiquetas = { gasto: 'Gasto', ingreso: 'Ingreso', ahorro: 'Ahorro' };
const signos = { gasto: '−', ingreso: '+', ahorro: '→' };
const iconos = { gasto: '↓', ingreso: '↑', ahorro: '●' };
const mesesCortos = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

document.getElementById('fecha').valueAsDate = new Date();

(function() {
  const scrollEl = document.getElementById('scroll');
  let startY = 0;
  document.addEventListener('touchstart', function(e) {
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', function(e) {
    if (!e.target.closest('#scroll')) { e.preventDefault(); return; }
    const y = e.touches[0].clientY;
    const arrastraAbajo = y > startY;
    const arrastraArriba = y < startY;
    const enElTope = scrollEl.scrollTop <= 0;
    const enElFondo = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 1;
    if ((enElTope && arrastraAbajo) || (enElFondo && arrastraArriba)) e.preventDefault();
  }, { passive: false });
})();

const hora = new Date().getHours();
document.getElementById('greeting').textContent =
  (hora < 12 ? 'Buenos días' : hora < 19 ? 'Buenas tardes' : 'Buenas noches');

// --- Navegación entre pantallas (tipo app, con animación) ---
document.querySelectorAll('.nav-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const destino = btn.dataset.screen;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.toggle('active', s.id === 'screen-' + destino);
    });
    document.getElementById('scroll').scrollTo(0, 0);
  });
});
function irA(pantalla) {
  document.querySelector('.nav-btn[data-screen="' + pantalla + '"]').click();
}
document.getElementById('preview-card').addEventListener('click', function() { irA('analisis'); });

// --- Tabs: delegated listener, reutilizado por el form de agregar y la hoja de edición ---
function crearToggle(containerEl) {
  const indicator = containerEl.querySelector('.tab-indicator');
  let actual = 'gasto';
  function set(tipo) {
    actual = tipo;
    const btn = containerEl.querySelector('button[data-type="' + tipo + '"]');
    indicator.style.width = btn.offsetWidth + 'px';
    indicator.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    indicator.style.background = coloresTab[tipo];
    containerEl.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-selected', b.dataset.type === tipo ? 'true' : 'false');
    });
  }
  containerEl.addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-type]');
    if (!btn) return;
    set(btn.dataset.type);
  });
  return { set: set, get: () => actual };
}

const toggleAdd = crearToggle(document.getElementById('toggle-add'));
const toggleEdit = crearToggle(document.getElementById('toggle-edit'));
toggleAdd.set('gasto');
toggleEdit.set('gasto');

// --- Toggle quincena / mensual en Análisis ---
const togglePeriodoEl = document.getElementById('toggle-periodo');
const periodIndicator = document.getElementById('period-indicator');
function setPeriodo(p) {
  modoAnalisis = p;
  const btn = togglePeriodoEl.querySelector('button[data-periodo="' + p + '"]');
  periodIndicator.style.width = btn.offsetWidth + 'px';
  periodIndicator.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
  togglePeriodoEl.querySelectorAll('button').forEach(b => {
    b.setAttribute('aria-selected', b.dataset.periodo === p ? 'true' : 'false');
  });
  renderAnalisis();
}
togglePeriodoEl.addEventListener('click', function(e) {
  const btn = e.target.closest('button[data-periodo]');
  if (!btn) return;
  setPeriodo(btn.dataset.periodo);
});
setPeriodo('quincena');

window.addEventListener('resize', function() {
  toggleAdd.set(toggleAdd.get());
  toggleEdit.set(toggleEdit.get());
  setPeriodo(modoAnalisis);
});

function cargarDatos() {
  apiGet('list').then(function(res) {
    datosCargados = true;
    if (res && res.ok) { gastos = res.data || []; render(); }
    else mostrarErrorCarga();
  }).catch(function() {
    datosCargados = true;
    mostrarErrorCarga();
  });

  setTimeout(function() {
    if (!datosCargados) mostrarErrorCarga();
  }, 9000);
}

function mostrarErrorCarga() {
  document.getElementById('lista').innerHTML =
    '<div class="empty">No se pudo cargar.<br><span class="retry" onclick="reintentar()">Reintentar</span></div>';
}

function reintentar() {
  datosCargados = false;
  document.getElementById('lista').innerHTML = '<div class="skeleton"></div><div class="skeleton" style="opacity:.7"></div>';
  cargarDatos();
}

document.getElementById('form-gasto').addEventListener('submit', function(e) {
  e.preventDefault();
  const monto = parseFloat(document.getElementById('monto').value);
  const fecha = document.getElementById('fecha').value;
  const nota = document.getElementById('nota').value;
  if (!monto || monto <= 0) return;

  const mov = { id: String(Date.now()), monto, fecha, nota, tipo: toggleAdd.get() };
  const btn = document.getElementById('btn-add');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  apiPost({ action: 'add', mov: mov }).then(function(res) {
    if (!res || !res.ok) throw new Error(res && res.error);
    gastos.unshift(mov);
    render();
    showToast('Movimiento agregado');
    document.getElementById('form-gasto').reset();
    document.getElementById('fecha').valueAsDate = new Date();
    toggleAdd.set('gasto');
    btn.disabled = false;
    btn.textContent = 'Agregar';
    irA('inicio');
  }).catch(function() {
    showToast('Error al guardar', true);
    btn.disabled = false;
    btn.textContent = 'Agregar';
  });
});

// --- Detalle / edición de un movimiento ---
function abrirDetalle(id) {
  const mov = gastos.find(g => String(g.id) === String(id));
  if (!mov) return;
  editandoId = mov.id;
  document.getElementById('edit-monto').value = mov.monto;
  document.getElementById('edit-fecha').value = mov.fecha;
  document.getElementById('edit-nota').value = mov.nota || '';
  toggleEdit.set(mov.tipo);
  document.getElementById('overlay').classList.add('show');
}

function cerrarDetalle() {
  document.getElementById('overlay').classList.remove('show');
  editandoId = null;
}

document.getElementById('sheet-close').addEventListener('click', cerrarDetalle);
document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target.id === 'overlay') cerrarDetalle();
});

document.getElementById('form-edit').addEventListener('submit', function(e) {
  e.preventDefault();
  if (!editandoId) return;
  const monto = parseFloat(document.getElementById('edit-monto').value);
  const fecha = document.getElementById('edit-fecha').value;
  const nota = document.getElementById('edit-nota').value;
  if (!monto || monto <= 0) return;

  const mov = { id: editandoId, monto, fecha, nota, tipo: toggleEdit.get() };
  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.textContent = 'Guardando...';

  apiPost({ action: 'update', mov: mov }).then(function(res) {
    if (!res || !res.ok) throw new Error(res && res.error);
    const idx = gastos.findIndex(g => String(g.id) === String(mov.id));
    if (idx !== -1) gastos[idx] = mov;
    render();
    showToast('Movimiento actualizado');
    btn.disabled = false;
    btn.textContent = 'Guardar';
    cerrarDetalle();
  }).catch(function() {
    showToast('Error al guardar', true);
    btn.disabled = false;
    btn.textContent = 'Guardar';
  });
});

document.getElementById('btn-eliminar').addEventListener('click', function() {
  if (!editandoId) return;
  const id = editandoId;
  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Eliminando...';

  apiPost({ action: 'delete', id: id }).then(function(res) {
    if (!res || !res.ok) throw new Error(res && res.error);
    gastos = gastos.filter(g => String(g.id) !== String(id));
    render();
    btn.disabled = false;
    btn.textContent = 'Eliminar';
    cerrarDetalle();
    showToast('Movimiento eliminado');
  }).catch(function() {
    btn.disabled = false;
    btn.textContent = 'Eliminar';
    showToast('No se pudo borrar', true);
  });
});

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function fmt(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtCompact(n) {
  if (Math.abs(n) >= 1000) return (n < 0 ? '-' : '') + '$' + (Math.abs(n) / 1000).toFixed(1).replace('.0', '') + 'k';
  return '$' + Math.round(Math.abs(n));
}

function diasEnMes(y, m) { return new Date(y, m + 1, 0).getDate(); }

function periodoDe(fechaStr, modo) {
  const d = new Date(fechaStr + 'T00:00:00');
  if (isNaN(d)) return null;
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if (modo === 'mensual') {
    return { key: y + '-' + m, label: mesesCortos[m] + ' ' + String(y).slice(2), start: new Date(y, m, 1).getTime() };
  }
  const q = day <= 15 ? 0 : 1;
  const label = (q === 0 ? '1-15' : ('16-' + diasEnMes(y, m))) + ' ' + mesesCortos[m];
  return { key: y + '-' + m + '-' + q, label: label, start: new Date(y, m, q === 0 ? 1 : 16).getTime() };
}

function agruparPorPeriodo(modo) {
  const porPeriodo = {};
  gastos.forEach(function(g) {
    if (g.tipo !== 'gasto' && g.tipo !== 'ingreso') return;
    const p = periodoDe(g.fecha, modo);
    if (!p) return;
    if (!porPeriodo[p.key]) porPeriodo[p.key] = { label: p.label, start: p.start, ingreso: 0, gasto: 0 };
    porPeriodo[p.key][g.tipo] += Number(g.monto) || 0;
  });
  return Object.values(porPeriodo).sort(function(a, b) { return a.start - b.start; });
}

// --- Vista previa en Inicio: ingreso vs gasto del mes actual ---
function renderPreview() {
  const now = new Date();
  let ingreso = 0, gasto = 0;
  gastos.forEach(function(g) {
    const d = new Date(g.fecha + 'T00:00:00');
    if (isNaN(d) || d.getFullYear() !== now.getFullYear() || d.getMonth() !== now.getMonth()) return;
    if (g.tipo === 'ingreso') ingreso += Number(g.monto) || 0;
    if (g.tipo === 'gasto') gasto += Number(g.monto) || 0;
  });
  const max = Math.max(1, ingreso, gasto);
  const wrap = document.getElementById('preview-bars');
  wrap.innerHTML =
    '<div class="preview-bar-col">' +
      '<span class="preview-bar-val">' + fmtCompact(ingreso) + '</span>' +
      '<div class="preview-bar ingreso" style="height:' + Math.max(6, (ingreso / max) * 100) + '%"></div>' +
      '<span class="preview-bar-lbl">Ingreso</span>' +
    '</div>' +
    '<div class="preview-bar-col">' +
      '<span class="preview-bar-val">' + fmtCompact(gasto) + '</span>' +
      '<div class="preview-bar gasto" style="height:' + Math.max(6, (gasto / max) * 100) + '%"></div>' +
      '<span class="preview-bar-lbl">Gasto</span>' +
    '</div>';
}

// --- Análisis: gráfica quincenal/mensual + estadísticas ---
function renderAnalisis() {
  const wrap = document.getElementById('chart-wrap');
  const tip = document.getElementById('chart-tip');
  const statRow = document.getElementById('stat-row');
  const insight = document.getElementById('insight');
  if (!wrap) return;

  const periodos = agruparPorPeriodo(modoAnalisis).slice(-6);
  tip.textContent = 'Toca una barra para ver el detalle';

  if (periodos.length === 0) {
    wrap.innerHTML = '<div class="chart-empty">Agrega un gasto o ingreso para ver el análisis</div>';
    tip.textContent = '';
    statRow.innerHTML = '';
    insight.style.display = 'none';
    return;
  }
  insight.style.display = 'block';

  const W = 320, H = 150, padT = 14;
  const maxVal = Math.max(1, ...periodos.map(function(p) { return Math.max(p.ingreso, p.gasto); }));
  const groupW = W / periodos.length;
  const barW = Math.min(28, groupW / 2 - 5);
  const gap = 2;

  function topRoundedPath(x, yTop, w, yBase, r) {
    const h = yBase - yTop;
    if (h <= 0) return '';
    if (h < r) r = h;
    return 'M' + x + ',' + (yTop + r) +
      ' Q' + x + ',' + yTop + ' ' + (x + r) + ',' + yTop +
      ' L' + (x + w - r) + ',' + yTop +
      ' Q' + (x + w) + ',' + yTop + ' ' + (x + w) + ',' + (yTop + r) +
      ' L' + (x + w) + ',' + yBase +
      ' L' + x + ',' + yBase + ' Z';
  }

  let svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 22) + '" width="100%" height="' + (H + 22) + '" preserveAspectRatio="xMidYMid meet">';
  [0, 0.5, 1].forEach(function(f) {
    const y = padT + (H - padT) * (1 - f);
    svg += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>';
  });

  periodos.forEach(function(p, i) {
    const cx = i * groupW + groupW / 2;
    const xIngreso = cx - barW - gap / 2;
    const xGasto = cx + gap / 2;
    const yIngreso = padT + (H - padT) * (1 - p.ingreso / maxVal);
    const yGasto = padT + (H - padT) * (1 - p.gasto / maxVal);

    svg += '<g class="bar-group" data-label="' + p.label + '" data-i="' + p.ingreso + '" data-g="' + p.gasto + '">';
    svg += '<rect x="' + (cx - groupW / 2) + '" y="0" width="' + groupW + '" height="' + H + '" fill="transparent"/>';
    if (p.ingreso > 0) svg += '<path d="' + topRoundedPath(xIngreso, yIngreso, barW, H, 4) + '" fill="var(--accent-2)"/>';
    if (p.gasto > 0) svg += '<path d="' + topRoundedPath(xGasto, yGasto, barW, H, 4) + '" fill="var(--danger)"/>';
    svg += '<text x="' + cx + '" y="' + (H + 16) + '" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Manrope, sans-serif">' + p.label + '</text>';
    svg += '</g>';
  });

  svg += '</svg>';
  wrap.innerHTML = svg;

  wrap.querySelectorAll('.bar-group').forEach(function(g) {
    g.addEventListener('click', function() {
      const label = g.getAttribute('data-label');
      const vi = parseFloat(g.getAttribute('data-i'));
      const vg = parseFloat(g.getAttribute('data-g'));
      tip.innerHTML = '<b>' + label + '</b> · Ingreso ' + fmtCompact(vi) + ' · Gasto ' + fmtCompact(vg);
    });
  });

  const totalIngresoAll = gastos.filter(function(g) { return g.tipo === 'ingreso'; }).reduce(function(s, g) { return s + Number(g.monto); }, 0);
  const totalGastoAll = gastos.filter(function(g) { return g.tipo === 'gasto'; }).reduce(function(s, g) { return s + Number(g.monto); }, 0);
  const totalAhorroAll = gastos.filter(function(g) { return g.tipo === 'ahorro'; }).reduce(function(s, g) { return s + Number(g.monto); }, 0);
  const promIngreso = periodos.reduce(function(s, p) { return s + p.ingreso; }, 0) / periodos.length;
  const promGasto = periodos.reduce(function(s, p) { return s + p.gasto; }, 0) / periodos.length;
  const tasaAhorro = totalIngresoAll > 0 ? (totalAhorroAll / totalIngresoAll) * 100 : 0;

  statRow.innerHTML =
    '<div class="stat-tile"><div class="stat-lbl">Ingreso prom.</div><div class="stat-val" style="color:var(--accent-2)">' + fmtCompact(promIngreso) + '</div></div>' +
    '<div class="stat-tile"><div class="stat-lbl">Gasto prom.</div><div class="stat-val" style="color:var(--danger)">' + fmtCompact(promGasto) + '</div></div>' +
    '<div class="stat-tile"><div class="stat-lbl">Tasa de ahorro</div><div class="stat-val">' + tasaAhorro.toFixed(0) + '%</div></div>';

  const peorPeriodo = periodos.reduce(function(a, b) { return b.gasto > a.gasto ? b : a; }, periodos[0]);
  const periodoTxt = modoAnalisis === 'mensual' ? 'mes' : 'quincena';
  if (peorPeriodo.gasto > 0) {
    insight.innerHTML = 'Tu ' + periodoTxt + ' con más gasto fue <b>' + peorPeriodo.label + '</b>, con ' + fmt(peorPeriodo.gasto) + ' en salidas.';
  } else {
    insight.innerHTML = 'Aún no registras gastos en este periodo.';
  }
}

function render() {
  const lista = document.getElementById('lista');
  const btnVerMas = document.getElementById('btn-ver-mas');
  document.getElementById('section-count').textContent = gastos.length
    ? gastos.length + (gastos.length === 1 ? ' movimiento' : ' movimientos')
    : '';

  if (gastos.length === 0) {
    lista.innerHTML = '<div class="empty">Sin movimientos todavía</div>';
    btnVerMas.style.display = 'none';
  } else {
    const visibles = mostrarTodos ? gastos : gastos.slice(0, LIMITE_LISTA);
    const items = visibles.map(function(g, i) {
      try {
        return '<div class="item" data-id="' + g.id + '" id="item-' + g.id + '" style="animation-delay:' + (Math.min(i, 8) * 0.03) + 's">' +
          '<div class="left">' +
            '<div class="icon ' + g.tipo + '">' + (iconos[g.tipo] || '•') + '</div>' +
            '<div class="text">' +
              '<span class="monto ' + g.tipo + '">' + (signos[g.tipo] || '') + ' ' + fmt(g.monto) + '</span>' +
              '<span class="meta">' + (etiquetas[g.tipo] || g.tipo) + (g.nota ? ' — ' + g.nota : '') + ' · ' + g.fecha + '</span>' +
            '</div>' +
          '</div>' +
          '<span class="chev">›</span>' +
        '</div>';
      } catch (err) {
        return '';
      }
    }).join('');
    lista.innerHTML = items;
    lista.querySelectorAll('.item').forEach(function(el) {
      el.addEventListener('click', function() { abrirDetalle(el.dataset.id); });
    });

    if (gastos.length > LIMITE_LISTA) {
      btnVerMas.style.display = 'block';
      btnVerMas.textContent = mostrarTodos ? 'Ver menos' : 'Ver más (' + (gastos.length - LIMITE_LISTA) + ')';
    } else {
      btnVerMas.style.display = 'none';
    }
  }

  const totalIngreso = gastos.filter(g => g.tipo === 'ingreso').reduce((s, g) => s + Number(g.monto), 0);
  const totalGasto = gastos.filter(g => g.tipo === 'gasto').reduce((s, g) => s + Number(g.monto), 0);
  const totalAhorro = gastos.filter(g => g.tipo === 'ahorro').reduce((s, g) => s + Number(g.monto), 0);
  const disponible = totalIngreso - totalGasto - totalAhorro;

  document.getElementById('sum-ingreso').textContent = fmt(totalIngreso);
  document.getElementById('sum-gasto').textContent = fmt(totalGasto);
  document.getElementById('sum-ahorro').textContent = fmt(totalAhorro);
  document.getElementById('sum-disponible').textContent = fmt(disponible);

  renderPreview();
  renderAnalisis();
}

document.getElementById('btn-ver-mas').addEventListener('click', function() {
  mostrarTodos = !mostrarTodos;
  render();
});

cargarDatos();
</script>
